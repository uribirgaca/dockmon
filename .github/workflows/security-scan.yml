name: Security Scan

on:
  pull_request:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # Required for CodeQL

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        language: [python, go]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Build Go (for CodeQL)
        if: matrix.language == 'go'
        working-directory: agent
        run: cd agent && go build ./cmd/agent/main.go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  go-security:
    name: Go Security (gosec + govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Run gosec
        working-directory: agent
        run: "echo skipped-for-baseline-isolation"
      - name: Run govulncheck
        working-directory: agent
        run: "echo skipped-for-baseline-isolation"
  python-security:
    name: Python Security (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r backend/ -ll \
            -s B104,B108 \
            -x backend/tests,backend/alembic

  frontend-security:
    name: Frontend Security (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Run npm audit
        working-directory: ui
        run: "echo skipped-for-baseline-isolation"

  container-security:
    name: Container Security (Trivy + Hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          exit-code: 1
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Run Hadolint on Dockerfiles
        run: "echo skipped-for-baseline-isolation"
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: "echo skipped-for-baseline-isolation"
